<!DOCTYPE html>
<html>
<head>
    <title>KLBS26 Registration</title>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #070f1f;
            color: white;
        }

        .container {
            max-width: 820px;
            margin: auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 34px;
            margin: 0;
        }

        .header p {
            font-size: 14px;
            color: #9fb4ff;
            margin-top: 6px;
        }

        .card {
            background: #111c36;
            padding: 30px;
            border-radius: 14px;
        }

        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 16px;
            font-weight: 700;
        }

        input, textarea, select {
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: white;
            color: black;
            font-size: 14px;
        }

        textarea { height: 90px; resize: none; }

        .full { grid-column: span 2; }

        .camera-box {
            grid-column: span 2;
            background: #0b1b38;
            padding: 15px;
            border-radius: 10px;
        }

        video {
            width: 100%;
            border-radius: 10px;
        }

        #preview {
            width: 100%;
            margin-top: 10px;
            border-radius: 10px;
            display: none;
        }

        .capture {
            margin-top: 10px;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: #16a34a;
            color: white;
        }

        button.submit {
            grid-column: span 2;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
        }

        .hidden { display: none; }

        @media(max-width: 700px) {
            form { grid-template-columns: 1fr; }
            .full, .camera-box, button.submit { grid-column: span 1; }
        }
    </style>
</head>

<body>

<div class="container">

    <div style="text-align:center; margin-bottom:20px;">
        <img src="{{ url_for('static', filename='images/logo.png') }}"
             style="width:90px; height:90px; object-fit:contain;">
    </div>

    <div class="header">
        <h1>Kingdom, Leaders and Business Summit 2026</h1>
        <p>THINK GLOBAL</p>
        <p>Please complete this registration form carefully.</p>
    </div>

    <div class="card">

        <form method="POST" action="/register" onsubmit="return validateForm()">

            <div class="field">
                <label>Full Name</label>
                <input name="full_name" required>
            </div>

            <div class="field">
                <label>Phone Number (Preferably WhatsApp)</label>
                <input name="phone" required>
            </div>

            <div class="field full">
                <label>Email Address</label>
                <input name="email" required>
            </div>

            <div class="field">
                <label>Occupation</label>
                <input name="occupation" required>
            </div>

            <div class="field">
                <label>Address</label>
                <input name="location" required>
            </div>

            <div class="field full">
                <label>What are your expectations for the summit?</label>
                <textarea name="expectations" required></textarea>
            </div>

            <div class="field full">
                <label>What do you hope to gain from the summit?</label>
                <textarea name="goals" required></textarea>
            </div>

            <div class="field full">
                <label>How did you hear about us?</label>
                <select name="referral" id="referral" onchange="checkReferral()" required>
                    <option value="">Select</option>
                    <option>Social Media</option>
                    <option>Personal Invitation</option>
                    <option>Flyer</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="field full">
                <input type="text" name="referral_other"
                       id="referral_other"
                       placeholder="Please specify"
                       class="hidden">
            </div>

            <!-- CAMERA -->
            <div class="camera-box">
                <video id="video" autoplay></video>

                <button type="button" class="capture" onclick="takePhoto()">
                    Capture Face
                </button>

                <img id="preview">

                <input type="hidden" name="captured_image" id="captured_image">

                {% if error %}
                <p style="color:red; font-weight:bold;">{{ error }}</p>
                {% endif %}
            </div>

            <button class="submit" type="submit">Submit Registration</button>

        </form>

    </div>

</div>

<script>
let video = document.getElementById("video");

navigator.mediaDevices.getUserMedia({ video: true })
.then(stream => video.srcObject = stream);

function takePhoto() {
    let canvas = document.createElement("canvas");
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    let ctx = canvas.getContext("2d");
    ctx.drawImage(video, 0, 0);

    let image = canvas.toDataURL("image/jpeg");

    document.getElementById("captured_image").value = image;

    let preview = document.getElementById("preview");
    preview.src = image;
    preview.style.display = "block";

    alert("Face captured!");
}

function checkReferral() {
    let r = document.getElementById("referral").value;
    let o = document.getElementById("referral_other");

    if (r === "Other") {
        o.classList.remove("hidden");
        o.required = true;
    } else {
        o.classList.add("hidden");
        o.required = false;
    }
}

function validateForm() {
    let image = document.getElementById("captured_image").value;

    if (!image) {
        alert("Capture your face first!");
        return false;
    }

    return true;
}
</script>

</body>
</html>
