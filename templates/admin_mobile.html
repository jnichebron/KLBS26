<!DOCTYPE html>
<html>
<head>
    <title>KLBS26 Mobile Admin</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #070f1f;
            color: white;
        }

        .screen {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            text-align: center;
        }

        .img {
            width: 100%;
            height: 55vh;
            object-fit: cover;
            border-radius: 15px;
        }

        .name {
            font-size: 26px;
            font-weight: bold;
            margin-top: 10px;
        }

        .info {
            font-size: 14px;
            color: #9fb4ff;
        }

        .tag {
            color: #16a34a;
            font-weight: bold;
            margin-top: 5px;
        }

        .btns {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
        }

        .checkin { background: #16a34a; color: white; }
        .delete { background: #dc2626; color: white; }

        .topbar {
            text-align: center;
            padding: 10px;
            color: #9fb4ff;
        }
    </style>
</head>

<body>

<div class="topbar">
    MOBILE ADMIN MODE
</div>

{% for user in users %}
<div class="screen">

    {% if user['image'] %}
    <img class="img"
         src="{{ url_for('static', filename=user['image']) }}">
    {% endif %}

    <div>
        <div class="name">{{ user['full_name'] }}</div>
        <div class="info">{{ user['phone'] }}</div>
        <div class="info">{{ user['email'] }}</div>
        <div class="info">{{ user['location'] }}</div>
        <div class="tag">TAG: {{ user['tag'] }}</div>
    </div>

    <div class="btns">

        {% if user['checked_in'] == 0 %}
        <a href="/checkin/{{ user['id'] }}" style="flex:1;">
            <button class="checkin">CHECK IN</button>
        </a>
        {% endif %}

        <a href="/delete/{{ user['id'] }}" style="flex:1;">
            <button class="delete">DELETE</button>
        </a>

    </div>

</div>
{% endfor %}

</body>
</html>
