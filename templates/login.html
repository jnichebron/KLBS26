<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KLBS26 Admin Login</title>

```
<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, sans-serif;
    }

    body{
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#070f1f;
        padding:20px;
    }

    .login-card{
        width:100%;
        max-width:420px;
        background:#111c36;
        border-radius:20px;
        padding:40px;
        box-shadow:0 15px 35px rgba(0,0,0,0.3);
    }

    .logo{
        text-align:center;
        margin-bottom:10px;
    }

    .logo h1{
        color:white;
        font-size:28px;
        margin-bottom:5px;
    }

    .logo p{
        color:#9fb4ff;
        font-size:14px;
    }

    .form-group{
        margin-top:20px;
    }

    .form-group label{
        display:block;
        color:white;
        margin-bottom:8px;
        font-size:14px;
    }

    .form-group input{
        width:100%;
        padding:14px;
        border:none;
        border-radius:10px;
        background:#1a2749;
        color:white;
        font-size:14px;
    }

    .form-group input:focus{
        outline:none;
        border:1px solid #16a34a;
    }

    .login-btn{
        width:100%;
        margin-top:25px;
        padding:14px;
        border:none;
        border-radius:10px;
        background:#16a34a;
        color:white;
        font-size:15px;
        font-weight:bold;
        cursor:pointer;
    }

    .login-btn:hover{
        opacity:.9;
    }

    .error{
        background:#dc2626;
        color:white;
        padding:12px;
        border-radius:10px;
        margin-top:15px;
        text-align:center;
        font-size:14px;
    }

    .footer{
        margin-top:20px;
        text-align:center;
        color:#9fb4ff;
        font-size:12px;
    }

</style>
```

</head>
<body>

<div class="login-card">

```
<div class="logo">
    <h1>KLBS26</h1>
    <p>Admin Dashboard Login</p>
</div>

{% if error %}
<div class="error">
    {{ error }}
</div>
{% endif %}

<form method="POST">

    <div class="form-group">
        <label>Username</label>
        <input
            type="text"
            name="username"
            required
        >
    </div>

    <div class="form-group">
        <label>Password</label>
        <input
            type="password"
            name="password"
            required
        >
    </div>

    <button class="login-btn" type="submit">
        Login
    </button>

</form>

<div class="footer">
    Kingdom Leaders & Business Summit 2026
</div>
```

</div>

</body>
</html>
