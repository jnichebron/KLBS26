<!DOCTYPE html>
<html>
<head>
    <title>Registration Successful</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #070f1f;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #111c36;
            padding: 40px;
            border-radius: 14px;
            max-width: 650px;
            width: 100%;
            text-align: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }

        .success-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        h1 {
            color: #16a34a;
            margin-bottom: 20px;
            font-size: 32px;
        }

        p {
            font-size: 17px;
            line-height: 1.8;
            color: #dbe4ff;
            margin: 0;
        }

        .btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 24px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }

        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="success-icon">🎉</div>

        <h1>Registration Successful</h1>

        <p>
            Your registration is successful.
            <br><br>

            A unique registration tag has been sent to the email you provided.
            <br>

            Please kindly confirm.
            <br><br>

            Thank you.
        </p>

        <a href="/" class="btn">Return to Home</a>

    </div>

</body>
</html>
